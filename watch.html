<!DOCTYPE html>
<html>

<head>
  <title>YouTube Clone - Watch</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
    }

    .back-button {
      padding: 10px 18px;
      margin-bottom: 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .video-container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }

    iframe {
      width: 100%;
      height: 550px;
      border: none;
    }
  </style>
</head>

<body>

  <div class="video-container">

    <button class="back-button" onclick="history.back()">
      ← Back
    </button>

    <iframe
      id="videoPlayer"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const videoUrl = params.get("video");

    document.getElementById("videoPlayer").src = videoUrl + "?autoplay=1";

  </script>

</body>

</html>
